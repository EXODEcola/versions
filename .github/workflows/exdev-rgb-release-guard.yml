name: EXDEV RGB Release Guard
on:
  push:
    paths:
      - 'EXDEV_RGB/**'
      - 'EXDEV_RGB.json'
      - '.github/workflows/exdev-rgb-release-guard.yml'
  pull_request:
    paths:
      - 'EXDEV_RGB/**'
      - 'EXDEV_RGB.json'
      - '.github/workflows/exdev-rgb-release-guard.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to check for an actual downloadable GitHub ZIP (e.g. 1.6.11)'
        required: true
        default: '1.6.11'
        type: string
jobs:
  metadata-consistency:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical stable metadata
        run: python EXDEV_RGB/tools/release_guard.py validate --root .
      - name: Unit tests
        run: python -m unittest discover -s EXDEV_RGB/tools/tests -v
      - name: Verify published artifact before stable promotion
        if: github.event_name == 'workflow_dispatch'
        run: python EXDEV_RGB/tools/release_guard.py verify-remote --root . --version '${{ inputs.version }}'