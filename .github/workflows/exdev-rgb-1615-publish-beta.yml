name: EXDEV RGB 1.6.15 publish beta artifact
on:
  push:
    branches:
      - build/exdev-rgb-1615-native-engine-startup-fix
    paths:
      - '.github/workflows/exdev-rgb-1615-publish-beta.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified Windows build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 40695890428 --repo "$GITHUB_REPOSITORY" --name EXDEV_RGB_1.6.15_BETA_ENGINE_START_UNTESTED --dir ./candidate
          test -f candidate/EXDEV_RGB_Setup_1.6.15_Beta.exe
          size=$(stat -c '%s' candidate/EXDEV_RGB_Setup_1.6.15_Beta.exe)
          test "$size" -gt 50000000
          echo "BETA_EXE_BYTES=$size" >> "$GITHUB_STEP_SUMMARY"
          sha256sum candidate/EXDEV_RGB_Setup_1.6.15_Beta.exe | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish GitHub prerelease for beta channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v1.6.15-beta'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Prerelease already exists: refusing overwrite'
            exit 1
          fi
          gh release create "$tag" ./candidate/EXDEV_RGB_Setup_1.6.15_Beta.exe --repo "$GITHUB_REPOSITORY" --target "4381a40205f5e3bf5a6a47f8538cfdd435de8c2c" --title 'EXDEV RGB 1.6.15 Beta - Native Engine Startup Fix' --notes 'Unsigned prerelease. Fix installer shutdown of Native Engine after EXDEV update; bounded task restart and user-visible warning. Preserve verified rollback, all RGB profiles and FAN LOCK. Unsigned test beta, Stable unchanged.' --prerelease
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets,isPrerelease